<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог Imdiva</title>
    <style>
        body {
            background-color: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .catalog-sheet {
            width: 650px;
            background: #ffffff;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .catalog-header {
            text-align: center;
            margin-bottom: 35px;
        }
        /* Стили для вашего логотипа с GitHub */
        .logo-img {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 210px;
            box-sizing: border-box;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-text {
            font-size: 12px;
            color: #666;
            margin-top: 12px;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="catalog-sheet">
    <!-- Шапка с вашим изображением-логотипом -->
    <div class="catalog-header">
        <img src="37918-removebg-preview.png" alt="Логотип Imdiva" class="logo-img">
    </div>
    
    <!-- Сетка карточек 3x3 -->
    <div class="grid-container">
        <!-- Первая карточка с товаром -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?w=300" alt="Этно шарфы">
            <div class="card-text">| Этно шарфы |</div>
        </div>
        
        <!-- Пустые карточки сетки -->
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>
</div>

</body>
</html>
